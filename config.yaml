assistant:
  name: "Никси"            # имя ассистента (Nixi.EXE)
  default_model: gemini    # с каким LLM работаем по умолчанию: claude | gpt | gemini
  language: ru

# Две модели, переключаемые голосом/текстом.
# Скажи "Клод, ..." или "ГПТ, ..." чтобы адресовать конкретной модели
# или просто переключиться на неё до отмены.
models:
  claude:
    provider: anthropic
    model: claude-sonnet-4-6       # дёшево и быстро; можно claude-opus-4-8
    triggers: ["клод", "клауд", "claude", "клода"]
  gpt:
    provider: openai
    model: gpt-4o-mini             # дёшево; можно gpt-4o
    triggers: ["гпт", "чат гпт", "gpt", "джипити"]
  gemini:
    provider: google
    model: gemini-2.5-flash        # баланс скорости и качества; есть Free Tier
    # можно gemini-2.5-flash-lite (быстрее/дешевле) или gemini-2.5-pro (умнее)
    triggers: ["джемини", "гемини", "gemini", "джем", "гугл"]

# Распознавание речи (нужен голосовой режим)
stt:
  engine: faster-whisper
  model: models/faster-whisper-small   # локальная папка (скачай через snapshot_download). Или имя: tiny|base|small|medium|large-v3
  device: cuda             # cuda (GPU, нужны pip-пакеты nvidia-cublas-cu12 + nvidia-cudnn-cu12) | cpu
  compute_type: float16    # float16 для GPU; int8 для CPU
  language: ru

# Синтез речи
tts:
  engine: xtts             # xtts (нейро-клон, аниме-тембр) | edge (голос MS) | pyttsx3 (офлайн SAPI)
  # Активный голос: id пресета из voice_presets (ниже) ИЛИ ShortName edge-голоса.
  edge_voice: "nixi"
  edge_rate: "+0%"         # скорость для НЕпресетных голосов: "+10%", "-10%" и т.п.
  edge_pitch: "+0Hz"       # высота тона для НЕпресетных голосов: "+30Hz", "-10Hz"
  # Именованные «голоса-пресеты»: связка базовый edge-голос + темп + высота тона.
  # Появляются отдельной строкой в выпадашке голосов панели. Пресет задаёт всё сам.
  voice_presets:
    nixi:
      label: "Никси (аниме)"        # как показывать в UI
      edge_voice: "ru-RU-SvetlanaNeural"  # базовый женский нейро-голос
      edge_rate: "+12%"             # живее, бодрее — анимешная подача
      edge_pitch: "+40Hz"          # звонкий «аниме» тембр (выше = выше голос)
  rate: 180                # скорость речи (для pyttsx3)
  voice: ""                # id голоса для pyttsx3; пусто = системный по умолчанию
  # XTTS-v2 (engine: xtts) — «настоящий» аниме-тембр через нейро-клонирование.
  # Установка: requirements-xtts.txt + setup_xtts.py (см. эти файлы).
  xtts:
    model: "tts_models/multilingual/multi-dataset/xtts_v2"
    use_cuda: true                  # GPU (RTX); false = CPU (медленнее, но без VRAM)
    language: "ru"                  # ru | en (XTTS многоязычный)
    speaker_wav: "voices/nixi_ref.wav"  # референс-клип голоса (клонируется его тембр)
    speaker: null                   # встроенный спикер XTTS, если нет референс-файла

# Активация записи в голосовом режиме
trigger:
  mode: wakeword           # wakeword (всегда слушает фразу) | push_to_talk (жми Enter)
  # Как ассистент понимает, что команда закончилась:
  #   phrase  — ждёт фразу-завершитель (например «выполняй»), удобно для длинных команд
  #   silence — ждёт паузу (тишину) после твоей речи
  end_mode: phrase
  end_phrases:             # фразы конца команды (распознаются через Vosk, можно несколько)
  - "выполняй"
  - "выполни"
  - "готово"
  silence_seconds: 1.2     # сколько тишины = конец команды (для end_mode: silence)
  max_seconds: 15          # максимум длины записи команды
  beep: true               # короткий сигнал после активации
  wakeword:
    model: models/vosk-model-small-ru   # модель Vosk (download_wake_model.py)
    phrases_file: wake_phrases.txt       # сюда калибровка сама пишет варианты под твой голос
    phrases:               # варианты, как Vosk может расслышать имя «Никси»
    - "никси"              # (откалибруй под свой голос: wake_calibrate live)
    - "ники"               # короткое имя Vosk часто слышит так
    - "никс"
    - "ник си"
    - "никс и"
    - "нихи"
    fuzzy: 0.7             # порог нечёткого совпадения 0..1 (ниже = чувствительнее)

# Аудио-устройства и громкость (управляются из веб-UI).
# device = null означает «системное по умолчанию». id берётся из GET /api/devices.
audio:
  input_device: 1          # id микрофона (null = по умолчанию)
  output_device: 9         # id колонок/наушников (null = по умолчанию)
  input_gain: 1.0          # усиление входа 0..2 (1.0 = без изменений)
  output_gain: 1.0         # громкость вывода 0..2

skills:
  enabled: true

# Иконка в системном трее Windows (src/tray.py).
tray:
  start_server: true            # поднимать веб-сервер вместе с треем
  open_browser_on_launch: false # сразу открыть панель в браузере при старте трея
